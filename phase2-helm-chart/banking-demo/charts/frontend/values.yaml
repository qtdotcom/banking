# ArgoCD/Helm merge theo key frontend
# Phase 2 giữ nguyên runtime behavior của frontend Phase 1, chỉ chuyển cách deploy sang Helm/ArgoCD.
frontend:
  fullnameOverride: frontend
  enabled: true
  image:
    repository: registry.gitlab.com/kiettt164/banking-demo-payment/frontend
    tag: v1
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  replicas: 2
  service:
    port: 80
    portName: http
  readinessProbe:
    enabled: true
    path: /
    port: 80
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "200m"
  securityContext:
    pod:
      seccompProfile:
        type: RuntimeDefault
    container:
      allowPrivilegeEscalation: false
