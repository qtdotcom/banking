# ArgoCD Project cho banking-demo.
# Áp dụng trước Application: kubectl apply -f project.yaml -n argocd
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: banking-demo
  namespace: argocd
  labels:
    app.kubernetes.io/name: banking-demo
spec:
  description: "Banking Demo - Phase 2 Helm and ArgoCD"
  sourceRepos:
    - https://github.com/qtdotcom/banking.git
  destinations:
    - namespace: banking
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: "*"
    - group: apps
      kind: "*"
    - group: batch
      kind: "*"
    - group: networking.k8s.io
      kind: "*"
  orphanedResources:
    warn: true
