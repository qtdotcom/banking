# Kube Prometheus Stack — Prometheus + Grafana (+ Alertmanager, operator)
# Helm chart: prometheus-community/kube-prometheus-stack
# Phase 3 baseline: scrape các service được triển khai từ Phase 2 trong namespace banking.

namespaceOverride: monitoring

# Prometheus: scrape banking services; các job name này được KEDA ScaledObject sử dụng.
prometheus:
  prometheusSpec:
    # Cho phép Tempo metrics-generator remote_write vào Prometheus
    enableRemoteWriteReceiver: true
    additionalScrapeConfigs:
      - job_name: auth-service
        metrics_path: /metrics
        static_configs:
          - targets: ['auth-service.banking.svc.cluster.local:8001']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: auth-service
      - job_name: account-service
        metrics_path: /metrics
        static_configs:
          - targets: ['account-service.banking.svc.cluster.local:8002']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: account-service
      - job_name: transfer-service
        metrics_path: /metrics
        static_configs:
          - targets: ['transfer-service.banking.svc.cluster.local:8003']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: transfer-service
      - job_name: notification-service
        metrics_path: /metrics
        static_configs:
          - targets: ['notification-service.banking.svc.cluster.local:8004']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: notification-service

      # Kong của Phase 2 chạy cùng namespace banking và đã bật prometheus plugin.
      - job_name: kong
        metrics_path: /metrics
        static_configs:
          - targets: ['kong.banking.svc.cluster.local:8001']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: kong

      # Redis/PostgreSQL Phase 2 không expose Prometheus metrics trực tiếp;
      # Phase 3 deploy exporter riêng trong namespace banking.
      - job_name: redis
        metrics_path: /metrics
        static_configs:
          - targets: ['redis-exporter.banking.svc.cluster.local:9121']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: redis
      - job_name: postgres
        metrics_path: /metrics
        static_configs:
          - targets: ['postgres-exporter.banking.svc.cluster.local:9187']
        relabel_configs:
          - source_labels: [__address__]
            target_label: instance
            replacement: postgres

# Grafana: datasources Loki + Tempo (sửa URL nếu release name khác)
grafana:
  adminPassword: admin
  # Persistence: PVC để lưu password admin, dashboards, datasources, users
  persistence:
    enabled: true
    type: pvc
    storageClassName: "monitoring-nfs"
    accessModes:
      - ReadWriteOnce
    size: 10Gi
  additionalDataSources:
    - name: Loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      access: proxy
      isDefault: false
    - name: Tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      access: proxy
      isDefault: false

  # Tùy chọn: Ingress cho Grafana (bật nếu cần, đổi host theo cluster)
  ingress:
    enabled: true
    ingressClassName: haproxy
    hosts:
      - grafana.npd-banking.co
